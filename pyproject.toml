[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-video-frame-keypoint-sampler"
version = "0.1.0"
description = "Semantic novelty-based video chunker extracting key interaction frames while discarding redundant static desktop frames"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-video-frame-keypoint-sampler = "agent_video_frame_keypoint_sampler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_video_frame_keypoint_sampler*"]
